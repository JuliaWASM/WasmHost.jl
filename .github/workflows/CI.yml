name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.12', '1.13']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: for f in js/common/*.mjs js/node/*.mjs; do node --check "$f"; done
      - uses: julia-actions/julia-runtest@v1
