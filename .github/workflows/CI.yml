name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.julia-version }}, ${{ matrix.runtime == 'node' && format('node {0}', matrix.node-version) || 'bun' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1.13']
        # the JavaScript adapter's tests (test/runtests.jl) in Node and in Bun: WASM_RUNTIME
        runtime: [node, bun]
        # (the Node versions: 24 is the minimum, JSPI on without a flag; the axis means nothing to Bun)
        node-version: ['24', '26']
        exclude:
          - runtime: bun
            node-version: '26'
    env:
      WASM_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: The adapter's modules load (${{ matrix.runtime }})
        run: |
          if [ "${{ matrix.runtime }}" = node ]; then
            for f in js/common/*.mjs js/node/*.mjs; do node --check "$f"; done
          else
            for f in js/common/*.mjs js/node/*.mjs; do bun -e "await import('$PWD/$f')" || exit 1; done
          fi
      - uses: julia-actions/julia-runtest@v1

  # End to end (test/e2e/e2e.jl): programs compiled by WasmCodegen (wasm-opt -O3, its default), run with the adapter
  # in Node and in Bun, compared with the same programs run natively. The decompress part needs WasmCodegen's
  # julia_regex host extension, which WasmCodegen no longer has: it is not run here (on any runtime).
  e2e:
    name: e2e ${{ matrix.part }}, ${{ matrix.runtime == 'node' && format('node {0}', matrix.node-version) || 'bun' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # (page: WasmHost.Page for WASI, both directions, and for JavaScript, sending only)
        part: [spool, import, page]
        runtime: [node, bun]
        node-version: ['24', '26']
        exclude:
          - runtime: bun
            node-version: '26'
    env:
      WASM_RUNTIME: ${{ matrix.runtime }}
      # (a run skipped for an engine gap fails the job: none is documented for Node 24, Node 26 or Bun 1.4)
      E2E_ALLOW_SKIP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gbaraldi/WasmCodegen.jl
          ref: 10cff8e4d04e451afe0946f5af90b8d39a76b724
          path: wcg
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.2'
      - uses: julia-actions/cache@v2
        with:
          cache-name: e2e-v1
      # (the e2e's server, native driver and module runner all run in WASM_RUNTIME)
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: e2e ${{ matrix.part }} in ${{ matrix.runtime }}${{ matrix.runtime == 'node' && format(' {0}', matrix.node-version) || '' }}
        run: julia --startup-file=no test/e2e/e2e.jl wcg ${{ matrix.part }}
